services:
  transmission:
    image: linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Oslo
      # IMPORTANT: Example login credentials. Change USER and PASS before deployment.
      - USER=admin
      - PASS=strongpassword
      - PEERPORT=51413

    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"

    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./watch:/watch